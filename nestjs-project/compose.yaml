services:
  nestjs-api:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    volumes:
      - .:/home/node/app
    environment:
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_ACCESS_KEY: streamtube
      STORAGE_SECRET_KEY: streamtube-secret
      STORAGE_REGION: us-east-1
      STORAGE_VIDEO_BUCKET: streamtube-videos
      STORAGE_THUMBNAIL_BUCKET: streamtube-thumbnails
      QUEUE_HOST: redis
      QUEUE_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      redis:
        condition: service_started
      storage:
        condition: service_started

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=streamtube
      - POSTGRES_PASSWORD=streamtube
      - POSTGRES_DB=streamtube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  storage:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: streamtube
      MINIO_ROOT_PASSWORD: streamtube-secret

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  video-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["npx", "ts-node", "-r", "tsconfig-paths/register", "src/worker.ts"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: streamtube
      DB_PASSWORD: streamtube
      DB_NAME: streamtube
      JWT_SECRET: change-me-in-production
      JWT_REFRESH_SECRET: change-me-refresh-in-production
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_ACCESS_KEY: streamtube
      STORAGE_SECRET_KEY: streamtube-secret
      STORAGE_REGION: us-east-1
      STORAGE_VIDEO_BUCKET: streamtube-videos
      STORAGE_THUMBNAIL_BUCKET: streamtube-thumbnails
      QUEUE_HOST: redis
      QUEUE_PORT: 6379
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      storage:
        condition: service_started


